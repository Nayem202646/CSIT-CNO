<style>
/* ===== THEME & LAYOUT ===== */
:root{--a:#7c3aed;--b:#06b6d4;--bg:#eef2ff;--card:rgba(255,255,255,.74);--tx:#1e1b4b;--fs:14px;--ln:#c7d2fe}
body.dark{--bg:#0b1020;--card:rgba(30,41,75,.72);--tx:#e5e7ff;--ln:#3b4470}
*{box-sizing:border-box}
body{margin:0;font:var(--fs)/1.45 'Noto Sans Bengali',system-ui,sans-serif;color:var(--tx);min-height:100vh;
background:radial-gradient(circle at 8% 8%,#f0abfc66,transparent 38%),radial-gradient(circle at 92% 18%,#67e8f966,transparent 38%),radial-gradient(circle at 50% 100%,#fde68a55,transparent 40%),var(--bg)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 6px 24px #0003}
header h1{font-size:1.15em;margin:0;flex:1;min-width:180px}
main{padding:0 16px 40px;max-width:none;width:100%;margin:0}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid #fff5;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px #4c1d9522}.entry-editor{min-height:100%;color:var(--entry-tx,var(--tx))}
.grid2{display:grid;grid-template-columns:minmax(260px,var(--entry-width,34%)) 10px minmax(260px,1fr);gap:0;align-items:stretch}.grid2>.card{min-width:0}.splitter{position:relative;cursor:col-resize;touch-action:none;user-select:none;margin:16px 0;border-radius:8px;background:linear-gradient(180deg,transparent,var(--a) 14%,var(--b) 86%,transparent);opacity:.72}.splitter:after{content:'⋮';position:sticky;top:48%;display:block;margin:auto;width:10px;text-align:center;color:#fff;background:var(--a);border-radius:8px;font-size:18px;font-weight:800}.splitter:hover,.splitter:active{opacity:1;transform:scaleX(1.3)}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.splitter{display:none}}
label{display:block;font-size:.85em;font-weight:600}
input,select{width:100%;padding:7px 9px;border:1px solid var(--ln);border-radius:10px;font:inherit;background:var(--card);color:var(--tx)}
input[type=color]{height:40px;padding:4px;cursor:pointer}body.dark input[type=number]{background:#111827!important;color:#f8fafc!important;border-color:#64748b!important;color-scheme:dark}body.dark input[type=number]::placeholder{color:#cbd5e1}body.dark input[type=number]:focus{outline:2px solid #38bdf8;outline-offset:1px}body.dark input[type=number]::-webkit-inner-spin-button{opacity:1;filter:invert(1)}
input.bad,select.bad{border-color:#ef4444!important;background:#fee2e2!important;color:#7f1d1d!important}.subject-missing td:first-child{background:#fee2e2!important;color:#991b1b!important;font-weight:800}.subject-missing input:not(:disabled){border-color:#ef4444!important;background:#fff1f2!important;color:#7f1d1d!important}
.btn{border:0;border-radius:12px;padding:8px 14px;font:inherit;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 4px 14px #7c3aed55;transition:.2s;margin:2px}.pill{font-size:.8em;padding:4px 9px;border-radius:99px;background:var(--a);color:#fff;font-weight:700}
.btn:hover{transform:translateY(-2px)}.btn.red{background:linear-gradient(90deg,#dc2626,#f97316)}.btn.gr{background:linear-gradient(90deg,#059669,#84cc16)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.row>*{flex:0 0 auto}
table.d{border-collapse:collapse;width:100%}table.d th,table.d td{border-bottom:1px solid var(--ln);padding:5px;text-align:left}
table.d input{min-width:54px;padding:4px 6px}.sc{overflow-x:auto}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kpi div{border-radius:14px;padding:12px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}.kpi b{font-size:1.6em;display:block}
.kpi div:nth-child(2n){background:linear-gradient(135deg,#f43f5e,#f59e0b)}.kpi div:nth-child(3n){background:linear-gradient(135deg,#059669,#22d3ee)}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:120;display:grid;gap:6px}
.toast{background:#111827;color:#fff;padding:9px 16px;border-radius:12px;box-shadow:0 8px 24px #0006;animation:ti .25s}.toast.err{background:#b91c1c}@keyframes ti{from{opacity:0;transform:translateY(10px)}}
.pv{overflow:auto;background:#fff;border-radius:10px;padding:6px}
#app{display:flex;min-height:100vh}#mw{flex:1;min-width:0}.help-message{display:none!important;margin:8px 0}body.show-instructions .help-message{display:block!important}
#side{width:190px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;padding:12px 8px;background:linear-gradient(180deg,var(--a),var(--b));display:flex;flex-direction:column;gap:10px;z-index:30;box-shadow:4px 0 24px #0003}
#sideimg{margin-top:auto;flex:none;width:100%;max-height:34vh;object-fit:contain;background:transparent;border-radius:10px;padding:0;box-shadow:none;mix-blend-mode:multiply;mask-image:linear-gradient(to bottom,transparent 0%,#000 7%,#000 93%,transparent 100%);transition:opacity .3s,filter .3s}

#nav{display:flex;flex-direction:column;gap:6px}
#nav button{text-align:left;border:0;border-radius:12px;padding:10px 12px;background:#ffffff26;color:#fff;cursor:pointer;font:inherit;transition:.2s}
#nav button.on,#nav button:hover{background:#fff;color:var(--a);transform:translateX(3px)}
@media(max-width:700px){#side{width:64px}#nav .lb{display:none}#devtxt{font-size:.62em}#nav button{text-align:center}}
table.xs{table-layout:fixed;width:100%;border:1px solid #6b7280;background:#fff;color:#111}.bulk-scroll{max-width:100%;overflow-x:auto}.bulk-scroll table.xs{width:100%;min-width:0;table-layout:fixed}.bulk-scroll table.xs th,.bulk-scroll table.xs td{min-width:0}.bulk-scroll table.xs input{font-size:inherit;padding:2px 0}.bulk-scroll table.xs th{position:sticky;top:0;z-index:2}
table.xs th,table.xs td{border:1px solid #9ca3af;padding:0;text-align:center;overflow:hidden;line-height:1.25}
table.xs th{background:#e5e7eb;padding:2px 1px;overflow-wrap:anywhere}table.xs td.rn{background:#e5e7eb;font-weight:600}
table.xs input{width:100%;min-width:0;border:0;border-radius:0;padding:3px 1px;font-size:inherit;text-align:center;background:#fff;color:#111}
table.xs input:focus{outline:2px solid var(--a);background:#fef9c3}table.xs input:disabled{background:#f3f4f6}
.av{width:100px;height:100px;border-radius:50%;margin:auto;background:#f59e0b;color:#fff;font:800 36px/100px sans-serif}.dcard a{color:#92400e;font-weight:700}
/* ===== DEVELOPER BUTTON ===== */
#devbtn{background:linear-gradient(90deg,#facc15,#fbbf24);color:#422006;font-weight:800;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;box-shadow:0 0 18px #facc15aa;font:inherit;font-weight:800}
#dev{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .45s;backdrop-filter:blur(10px);background:radial-gradient(circle,#78350f88,#1c0a0099)}
#dev.on{opacity:1}#dev canvas{position:absolute;inset:0;pointer-events:none}
.fall i{position:absolute;top:-70%;width:3px;height:60%;background:linear-gradient(transparent,#ffd700,transparent);box-shadow:0 0 14px gold;animation:fl linear infinite;opacity:.7}
@keyframes fl{to{transform:translateY(300%)}}
.dcard{position:relative;text-align:center;padding:34px 50px;border-radius:24px;background:linear-gradient(135deg,#fffbeb,#fde68a);color:#422006;box-shadow:0 0 60px gold,0 20px 60px #0008;transform:scale(.8);transition:transform .45s cubic-bezier(.2,1.4,.4,1);animation:gl 2.4s ease-in-out infinite}
#dev.on .dcard{transform:scale(1)}@keyframes gl{50%{box-shadow:0 0 110px #fde047,0 20px 60px #0008}}
.dcard h2{margin:6px 0;font-size:2em}.dev-name-link{color:inherit;text-decoration:none}.dev-name-link:hover{text-decoration:underline;text-decoration-color:#854d0e}
.dcard .dev-avatar{display:block;width:128px;height:128px;margin:0 auto 14px;border-radius:50%;object-fit:cover;object-position:center 24%;border:4px solid #fff;box-shadow:0 8px 24px #42200655}.dev-contact{display:inline-flex;align-items:center;gap:9px;margin:8px auto 0;padding:9px 16px;border-radius:999px;background:#25d366;color:#fff!important;text-decoration:none!important;font-weight:800;box-shadow:0 5px 14px #16653444}.dev-contact svg{width:24px;height:24px;display:block}.dev-contact:hover{filter:brightness(.95);transform:translateY(-1px)}
@media(prefers-reduced-motion:reduce){.fall i,.dcard{animation:none}}
/* ===== MARKSHEET (matches demo) ===== */
.sheet{position:relative;isolation:isolate;overflow:hidden;background-color:#fff;color:#000;font-family:'Times New Roman','Noto Sans Bengali',serif;font-size:11px;margin:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}.sheet-border{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0;pointer-events:none}
.sheet-content{position:relative;z-index:1}
.sheet h1{text-align:center;font-size:2em;margin:.2em 0}.sheet h2,.sheet h3{text-align:center;margin:.15em 0}.sheet h2{font-size:1.6em;text-decoration:underline}.sheet h3{font-size:1.35em}
.sheet .top{margin:.8em 0}.sheet .top p{margin:.4em 0;font-size:1.18em}
.sheet table{border-collapse:collapse}.sheet td,.sheet th{border:1px solid #000;padding:.18em .36em;text-align:center}
.sheet .mt{width:100%}.sheet .sig{border-top:1px solid #000;display:inline-block;padding-top:.25em;min-width:14em;text-align:center}
.sheet .tot{display:flex;flex-wrap:wrap;gap:1.4em;align-items:center;margin:.6em 0;font-size:1.27em}.sheet .box{border:1px solid #000;padding:.25em .8em}
.sheet .ad{font-size:1.36em;font-weight:bold;margin:.8em 0 .25em}
.th-blue th{background:#dbeafe}.th-blue h1{color:#1d4ed8}.th-green th{background:#dcfce7}.th-green h1{color:#047857}.th-gold th{background:#fef3c7}.th-gold h1{color:#b45309}

function utf8ToB64(bytes){let out='';for(let i=0;i<bytes.length;i+=0x8000)out+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(out)}
